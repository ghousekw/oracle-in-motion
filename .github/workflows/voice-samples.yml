name: voice-samples
on:
  push:
    branches: [voice-samples]
    paths: ['tools/voice/**', '.github/workflows/voice-samples.yml']
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: python tools/voice/samples.py
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add samples
          git commit -m "Voice samples [skip ci]" || echo "nothing to commit"
          git push
